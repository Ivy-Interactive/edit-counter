[package]
name = "edit-counter"
version = "0.1.0"
edition = "2021"
description = "Fast semantic code edit tracking and counting algorithm for AI agents and developers."
license = "MIT OR Apache-2.0"
authors = ["Ivy Interactive <dev@ivy.direct>"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
git2 = "0.19"
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"
